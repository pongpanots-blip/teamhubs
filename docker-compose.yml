services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: teamhub
      POSTGRES_PASSWORD: teamhub
      POSTGRES_DB: teamhub
    ports:
      - "5432:5432"
    volumes:
      - teamhub_pgdata:/var/lib/postgresql/data
      - ./docker/init-pgvector.sql:/docker-entrypoint-initdb.d/01-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamhub -d teamhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://teamhub:teamhub@db:5432/teamhub?schema=public
      BETTER_AUTH_URL: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

  # Daily census of every board, so the Cumulative Flow Diagram is a lookup
  # rather than a replay of the whole transition log. Replaceable by any
  # scheduler that can POST to /api/cron/snapshot with the same bearer token.
  snapshot:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SNAPSHOT_URL: http://web:3000/api/cron/snapshot
    volumes:
      - ./docker/snapshot-cron.sh:/snapshot-cron.sh:ro
    entrypoint: ["/bin/sh", "/snapshot-cron.sh"]
    depends_on:
      - web

volumes:
  teamhub_pgdata:
